[package]
name = "battery-dock"
version = "0.1.11"
edition = "2021"
authors = ["jorjanion"]
description = "Ultra-lightweight Windows taskbar dock for peripheral battery levels (headphones, mice, keyboards, gamepads, VR) with custom alerts"
license = "MIT"
repository = "https://github.com/jorjanion/BatteryDock"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"
hidapi = "2.6"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
directories = "6.0"
crossbeam-channel = "0.5"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Media_Audio",
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "implement"
] }
windows-core = "0.58"
tray-icon = "0.19"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
