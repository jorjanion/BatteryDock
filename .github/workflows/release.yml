name: Release Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Release & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Tests
        run: cargo test --verbose

      - name: Build Release Binary
        run: cargo build --release --locked

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress
          }

      - name: Compile Windows Installer (.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "output"
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
              $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
            }
          }
          & $iscc installer.iss

      - name: Package Portable Archive (.zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "package"
          Copy-Item "target/release/battery-dock.exe" -Destination "package/BatteryDock.exe"
          Copy-Item "README.md" -Destination "package/README.md"
          Copy-Item "LICENSE" -Destination "package/LICENSE"
          New-Item -ItemType Directory -Force -Path "package/assets"
          Copy-Item "assets/*" -Destination "package/assets/"
          Compress-Archive -Path "package/*" -DestinationPath "output/BatteryDock-Windows-Portable.zip" -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BatteryDock-Windows-Builds
          path: output/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/BatteryDock-Setup-*.exe
            output/BatteryDock-*.zip
          generate_release_notes: true
