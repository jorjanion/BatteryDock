name: Release Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Binary
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Tests
        run: cargo test --verbose

      - name: Build Release Binary
        run: cargo build --release --locked

      - name: Package Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "package"
          Copy-Item "target/release/battery-dock.exe" -Destination "package/BatteryDock.exe"
          Copy-Item "README.md" -Destination "package/README.md"
          Copy-Item "LICENSE" -Destination "package/LICENSE"
          Compress-Archive -Path "package/*" -DestinationPath "BatteryDock-Windows-x64.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatteryDock-Windows-x64
          path: BatteryDock-Windows-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BatteryDock-Windows-x64.zip
          generate_release_notes: true
